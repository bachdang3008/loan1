version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: loan_postgres
    restart: always
    environment:
      POSTGRES_DB: Loan
      POSTGRES_USER: bachnguyen
      POSTGRES_PASSWORD: '123456'
    ports:
      - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan_app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/Loan
      SPRING_DATASOURCE_USERNAME: bachnguyen
      SPRING_DATASOURCE_PASSWORD: '123456'
    depends_on:
      - postgres_db

volumes:
  postgres_data:


  